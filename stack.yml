services:

  backup-worker:
    image: ghcr.io/mrcsmcl/backup/pbs-client:latest
    environment:
      PBS_REPOSITORY: ${PBS_REPOSITORY:?err}
      PBS_PASSWORD: ${PBS_PASSWORD:?err}
      PBS_FINGERPRINT: ${PBS_FINGERPRINT:?err}
      BACKUP_PATH: /data
      BACKUP_INTERVAL: "43200"
      BACKUP_ID: "{{.Node.Hostname}}"
    volumes:
      - ${BACKUP_PATH_WORKER:?err}:/data:ro
      - ${BACKUP_STATE_WORKER:?err}:/var/lib/backup
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 300s
      timeout: 10s
      start_period: 120s
      retries: 5
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 300s
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup-manager:
    image: ghcr.io/mrcsmcl/backup/pbs-client:latest
    environment:
      PBS_REPOSITORY: ${PBS_REPOSITORY:?err}
      PBS_PASSWORD: ${PBS_PASSWORD:?err}
      PBS_FINGERPRINT: ${PBS_FINGERPRINT:?err}
      BACKUP_PATH: /data
      BACKUP_INTERVAL: "43200"
      BACKUP_ID: "{{.Node.Hostname}}"
    volumes:
      - ${BACKUP_PATH_MANAGER:?err}:/data:ro
      - ${BACKUP_STATE_MANAGER:?err}:/var/lib/backup
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 300s
      timeout: 10s
      start_period: 120s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 300s
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"